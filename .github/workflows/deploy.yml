name: Deploy EAS Cloud Computing

on:
  push:
    branches:
      - main  # Mesin akan menyala setiap ada kode masuk ke cabang 'main'

jobs:
  # PROSES 1: Membungkus kode jadi Docker dan mengirim ke DockerHub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Login ke Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mediscan-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/mediscan-frontend:latest

      - name: Build & Push Backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mediscan-backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/mediscan-backend:latest

  # PROSES 2: Meremote server AWS Frontend
  deploy-frontend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke EC2 Frontend
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.HOST_FRONTEND }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/mediscan-frontend:latest
            docker stop web-frontend || true
            docker rm web-frontend || true
            docker run -d --name web-frontend -p 80:80 ${{ secrets.DOCKER_USERNAME }}/mediscan-frontend:latest

  # PROSES 3: Meremote server AWS Backend
  deploy-backend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke EC2 Backend
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.HOST_BACKEND }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/mediscan-backend:latest
            docker stop web-api || true
            docker rm web-api || true
            # Pastikan portnya sesuai (saya pakai 8000 sebagai contoh)
            docker run -d --name web-api -p 8000:8000 ${{ secrets.DOCKER_USERNAME }}/mediscan-backend:latest
