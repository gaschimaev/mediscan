name: Deploy EAS Cloud Computing

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Login ke Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build dan Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mediscan-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/mediscan-frontend:latest

      - name: Build dan Push Backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mediscan-backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/mediscan-backend:latest

  deploy-frontend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke EC2 Frontend
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.HOST_FRONTEND }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl start docker
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/mediscan-frontend:latest
            sudo docker stop web-frontend || true
            sudo docker rm web-frontend || true
            sudo docker run -d --name web-frontend -p 80:80 ${{ secrets.DOCKER_USERNAME }}/mediscan-frontend:latest

  deploy-backend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke EC2 Backend
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.HOST_BACKEND }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl start docker
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/mediscan-backend:latest
            sudo docker stop web-api || true
            sudo docker rm web-api || true
            sudo docker run -d --name web-api \
              -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_PORT=${{ secrets.DB_PORT }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
              -e AZURE_CONTAINER_NAME=${{ secrets.AZURE_CONTAINER_NAME }} \
              -p 8000:8000 \
              ${{ secrets.DOCKER_USERNAME }}/mediscan-backend:latest
