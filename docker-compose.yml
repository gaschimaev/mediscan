services:
  backend:
    build: ./backend
    container_name: aimediscan-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build: ./frontend
    container_name: aimediscan-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always